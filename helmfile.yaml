repositories:
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

helmDefaults:
  createNamespace: true
  wait: true
  timeout: 900

environments:
  quickstart:
    values:
      - environments/defaults.yaml
      - environments/quickstart.yaml
      - environments/profiles/core.yaml
  quickstart-ai:
    values:
      - environments/defaults.yaml
      - environments/quickstart.yaml
      - environments/profiles/ai.yaml
  quickstart-observability:
    values:
      - environments/defaults.yaml
      - environments/quickstart.yaml
      - environments/profiles/observability.yaml
  quickstart-all:
    values:
      - environments/defaults.yaml
      - environments/quickstart.yaml
      - environments/profiles/all.yaml
  full:
    values:
      - environments/defaults.yaml
      - environments/full.yaml
      - environments/profiles/all.yaml

---

releases:
  - name: istio-gravitatehealth
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/istio-gravitatehealth
    installed: {{ if .Values.modules }}{{ .Values.modules.istio | default true }}{{ else }}true{{ end }}
    labels:
      phase: infra
      module: istio
    values:
      - values/releases/istio.yaml.gotmpl

  - name: fhir-server-ips
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/fhir-ips
    installed: {{ if .Values.modules }}{{ .Values.modules.fhirIps | default true }}{{ else }}true{{ end }}
    labels:
      phase: data
      module: fhir-ips
    values:
      - values/releases/fhir-server-ips.yaml.gotmpl
    needs:
      - {{ .Values.global.namespace }}/istio-gravitatehealth

  - name: fhir-server-epi
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/fhir-epi
    installed: {{ if .Values.modules }}{{ .Values.modules.fhirEpi | default true }}{{ else }}true{{ end }}
    labels:
      phase: data
      module: fhir-epi
    values:
      - values/releases/fhir-server-epi.yaml.gotmpl
    needs:
      - {{ .Values.global.namespace }}/istio-gravitatehealth

  - name: terminology-service
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/terminology-service
    installed: {{ if .Values.modules }}{{ .Values.modules.terminology | default true }}{{ else }}true{{ end }}
    labels:
      phase: data
      module: terminology-service
    needs:
      - {{ .Values.global.namespace }}/istio-gravitatehealth

  - name: keycloak
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/keycloak
    installed: {{ if .Values.modules }}{{ .Values.modules.keycloak | default true }}{{ else }}true{{ end }}
    labels:
      phase: iam
      module: keycloak
    values:
      - values/releases/keycloak.yaml.gotmpl
    needs:
      - {{ .Values.global.namespace }}/istio-gravitatehealth

  - name: keycloak-registration
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/keycloak-registration
    installed: {{ if .Values.modules }}{{ .Values.modules.keycloakRegistration | default true }}{{ else }}true{{ end }}
    labels:
      phase: iam
      module: keycloak-registration
    values:
      - values/releases/keycloak-registration.yaml.gotmpl
    needs:
      - {{ .Values.global.namespace }}/keycloak
      - {{ .Values.global.namespace }}/fhir-server-ips

  - name: fhir-connector
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/fhir-connector
    installed: {{ if .Values.modules }}{{ .Values.modules.fhirConnector | default true }}{{ else }}true{{ end }}
    labels:
      phase: core
      module: fhir-connector
    values:
      - values/releases/fhir-connector.yaml.gotmpl
    needs:
      - {{ .Values.global.namespace }}/fhir-server-ips
      - {{ .Values.global.namespace }}/fhir-server-epi

  - name: focusing-manager
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/focusing-manager
    installed: {{ if .Values.modules }}{{ .Values.modules.focusingManager | default true }}{{ else }}true{{ end }}
    labels:
      phase: core
      module: focusing-manager
    needs:
      - {{ .Values.global.namespace }}/fhir-server-ips
      - {{ .Values.global.namespace }}/fhir-server-epi

  - name: preprocessing-service-manual
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/preprocessing-service-manual
    installed: {{ if .Values.modules }}{{ .Values.modules.preprocessingManual | default true }}{{ else }}true{{ end }}
    labels:
      phase: extensions
      module: preprocessing-service-manual
    needs:
      - {{ .Values.global.namespace }}/focusing-manager

  - name: preprocessing-service-terminology
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/preprocessing-service-terminology
    installed: {{ if .Values.modules }}{{ .Values.modules.preprocessingTerminology | default true }}{{ else }}true{{ end }}
    labels:
      phase: extensions
      module: preprocessing-service-terminology
    needs:
      - {{ .Values.global.namespace }}/focusing-manager
      - {{ .Values.global.namespace }}/terminology-service

  - name: preprocessing-service-cleaner
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/preprocessing-service-cleaner
    installed: {{ if .Values.modules }}{{ .Values.modules.preprocessingCleaner | default true }}{{ else }}true{{ end }}
    labels:
      phase: extensions
      module: preprocessing-service-cleaner
    needs:
      - {{ .Values.global.namespace }}/focusing-manager

  - name: preprocessing-service-dictionary
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/preprocessing-service-dictionary
    installed: {{ if .Values.modules }}{{ .Values.modules.preprocessingDictionary | default true }}{{ else }}true{{ end }}
    labels:
      phase: extensions
      module: preprocessing-service-dictionary
    needs:
      - {{ .Values.global.namespace }}/focusing-manager

  - name: lens-selector-fhir
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/lens-selector-fhir
    installed: {{ if .Values.modules }}{{ .Values.modules.lensSelectorFhir | default true }}{{ else }}true{{ end }}
    labels:
      phase: extensions
      module: lens-selector-fhir
    needs:
      - {{ .Values.global.namespace }}/focusing-manager
      - {{ .Values.global.namespace }}/fhir-server-epi

  - name: lens-selector-git
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/lens-selector-git
    installed: {{ if .Values.modules }}{{ .Values.modules.lensSelectorGit | default true }}{{ else }}true{{ end }}
    labels:
      phase: extensions
      module: lens-selector-git
    needs:
      - {{ .Values.global.namespace }}/focusing-manager

  - name: lens-service-summary
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/lens-service-summary
    installed: {{ if .Values.modules }}{{ .Values.modules.lensServiceSummary | default false }}{{ else }}false{{ end }}
    labels:
      phase: ai
      module: lens-service-summary
    needs:
      - {{ .Values.global.namespace }}/focusing-manager

  - name: lens-service-plain-language
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/lens-service-plain-language
    installed: {{ if .Values.modules }}{{ .Values.modules.lensServicePlainLanguage | default false }}{{ else }}false{{ end }}
    labels:
      phase: ai
      module: lens-service-plain-language
    needs:
      - {{ .Values.global.namespace }}/focusing-manager

  - name: chat-with-epi
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/chat-with-epi
    installed: {{ if .Values.modules }}{{ .Values.modules.chatWithEpi | default false }}{{ else }}false{{ end }}
    labels:
      phase: ai
      module: chat-with-epi
    needs:
      - {{ .Values.global.namespace }}/fhir-server-epi
      - {{ .Values.global.namespace }}/fhir-server-ips

  - name: chatbot-interface
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/chatbot-interface
    installed: {{ if .Values.modules }}{{ .Values.modules.chatbotInterface | default false }}{{ else }}false{{ end }}
    labels:
      phase: ai
      module: chatbot-interface
    needs:
      - {{ .Values.global.namespace }}/chat-with-epi
      - {{ .Values.global.namespace }}/focusing-manager

  - name: supporting-material-manager
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/supporting-material-manager
    installed: {{ if .Values.modules }}{{ .Values.modules.supportingMaterialManager | default false }}{{ else }}false{{ end }}
    labels:
      phase: apps
      module: supporting-material-manager
    values:
      - values/releases/supporting-material-manager.yaml.gotmpl
    needs:
      - {{ .Values.global.namespace }}/fhir-server-epi

  - name: provenance-engine
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/provenance-engine
    installed: {{ if .Values.modules }}{{ .Values.modules.provenanceEngine | default false }}{{ else }}false{{ end }}
    labels:
      phase: apps
      module: provenance-engine

  - name: focusing-inspector
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/focusing-inspector
    installed: {{ if .Values.modules }}{{ .Values.modules.focusingInspector | default false }}{{ else }}false{{ end }}
    labels:
      phase: observability
      module: focusing-inspector
    needs:
      - {{ .Values.global.namespace }}/focusing-manager

  - name: gh-monit
    namespace: {{ .Values.global.namespace }}
    chart: oci://ghcr.io/gravitate-health/charts/gh-monit
    installed: {{ if .Values.modules }}{{ .Values.modules.ghMonit | default false }}{{ else }}false{{ end }}
    labels:
      phase: observability
      module: gh-monit

  - name: monitor-routing
    namespace: {{ .Values.global.monitoringNamespace }}
    chart: oci://ghcr.io/gravitate-health/charts/monitor-routing
    installed: {{ if .Values.modules }}{{ .Values.modules.monitoringStack | default false }}{{ else }}false{{ end }}
    labels:
      phase: observability
      module: monitor-routing
    values:
      - values/releases/monitor-routing.yaml.gotmpl
    needs:
      - {{ .Values.global.namespace }}/istio-gravitatehealth

  - name: prometheus
    namespace: {{ .Values.global.monitoringNamespace }}
    chart: prometheus-community/prometheus
    installed: {{ if .Values.modules }}{{ .Values.modules.monitoringStack | default false }}{{ else }}false{{ end }}
    labels:
      phase: observability
      module: prometheus
    values:
      - ../Monitor/helm/values/prometheus.yaml.gotmpl

  - name: loki
    namespace: {{ .Values.global.monitoringNamespace }}
    chart: grafana/loki
    installed: {{ if .Values.modules }}{{ .Values.modules.monitoringStack | default false }}{{ else }}false{{ end }}
    labels:
      phase: observability
      module: loki
    values:
      - ../Monitor/helm/values/loki.yaml

  - name: promtail
    namespace: {{ .Values.global.monitoringNamespace }}
    chart: grafana/promtail
    installed: {{ if .Values.modules }}{{ .Values.modules.monitoringStack | default false }}{{ else }}false{{ end }}
    labels:
      phase: observability
      module: promtail
    values:
      - ../Monitor/helm/values/promtail.yaml

  - name: prometheus-blackbox-exporter
    namespace: {{ .Values.global.monitoringNamespace }}
    chart: prometheus-community/prometheus-blackbox-exporter
    installed: {{ if .Values.modules }}{{ .Values.modules.monitoringStack | default false }}{{ else }}false{{ end }}
    labels:
      phase: observability
      module: prometheus-blackbox-exporter
    values:
      - ../Monitor/helm/values/blackbox-exporter.yaml

  - name: grafana
    namespace: {{ .Values.global.monitoringNamespace }}
    chart: grafana/grafana
    installed: {{ if .Values.modules }}{{ .Values.modules.monitoringStack | default false }}{{ else }}false{{ end }}
    labels:
      phase: observability
      module: grafana
    values:
      - ../Monitor/helm/values/grafana.yaml.gotmpl
